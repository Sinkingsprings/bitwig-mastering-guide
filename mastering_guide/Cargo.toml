[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "mastering_guide"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/Sinkingsprings/nih-plug.git", branch = "master" }
nih_plug_egui = { git = "https://github.com/Sinkingsprings/nih-plug.git", branch = "master" }
atomic_refcell = "0.1"
realfft = "3.3"
ebur128 = "0.1"
crossbeam-queue = "0.3"
atomic_float = "1.0"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Redirect all transitive consumers of audio-forge-rs/baseview to our patched
# fork that exits gracefully on POLLERR instead of panicking.
[patch."https://github.com/audio-forge-rs/baseview.git"]
baseview = { git = "https://github.com/Sinkingsprings/baseview.git", branch = "fix-null-window-crash" }

# Local fork override so we pick up the request_resize stale-size fix
# without round-tripping through GitHub. Drop this once the fork's master
# is pushed and Cargo.lock is updated.
[patch."https://github.com/Sinkingsprings/nih-plug.git"]
nih_plug = { path = "/home/jim/Desktop/forks/nih-plug" }
nih_plug_egui = { path = "/home/jim/Desktop/forks/nih-plug/nih_plug_egui" }

# Local fork override that makes ctx.set_zoom_factor actually scale the
# UI. Upstream egui-baseview passes native (un-zoomed) ppp to both
# screen_rect computation and tessellation, so set_zoom_factor was a
# visual no-op. Drop this once the fork is published and Cargo.lock
# updated.
[patch."https://github.com/audio-forge-rs/egui-baseview.git"]
egui-baseview = { path = "/home/jim/Desktop/forks/egui-baseview" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
